<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Token Queen</title>
  
  <!-- React (local vendor) -->
  <script crossorigin src="vendor/react.production.min.js"></script>
  <script crossorigin src="vendor/react-dom.production.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; }
    body { font-family: 'Crimson Pro', serif; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #05030a; color: #e8dcc4; }
    #root { width: 100%; min-height: 100vh; }
    @keyframes lifeDeltaFade { 0% { opacity: 1; transform: translateY(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes pipRing { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }
    @keyframes sanctumIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes petResponseIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    /* No-scrollbar utility (for chip strips) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    /* Smooth focus rings - subtle gold */
    button:focus-visible, input:focus-visible { outline: 1px solid rgba(201, 169, 97, 0.5); outline-offset: 2px; }
    /* Better tap targets */
    button { touch-action: manipulation; }
    /* Smooth scrolling for tab content */
    .tab-content { -webkit-overflow-scrolling: touch; }
    /* Modal backdrop must be fully opaque */
    .modal-backdrop { background: rgba(5, 3, 10, 0.97) !important; backdrop-filter: blur(12px) saturate(120%); -webkit-backdrop-filter: blur(12px) saturate(120%); }
    /* Search input glow on focus-within */
    .tq-search-wrap:focus-within { border-color: rgba(212, 184, 122, 0.6) !important; box-shadow: 0 0 0 1px rgba(212, 184, 122, 0.18), 0 0 20px rgba(212, 184, 122, 0.1), inset 0 1px 3px rgba(0,0,0,0.4) !important; }
    /* Selection - elegant gold */
    ::selection { background: rgba(212, 184, 122, 0.35); color: #f5e9d0; }
    /* Animations */
    @keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, 20px) scale(0.96); } 60% { opacity: 1; transform: translate(-50%, -2px) scale(1.02); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    @keyframes petPulse { 0%, 100% { box-shadow: 0 0 12px currentColor, 0 0 4px currentColor inset; } 50% { box-shadow: 0 0 20px currentColor, 0 0 6px currentColor inset; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    /* Smooth fade-in for tab content */
    @keyframes tabFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .tab-enter { animation: tabFadeIn 0.25s ease-out; }
    /* Disabled buttons */
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    /* Smooth scroll for the whole app */
    html { scroll-behavior: smooth; }
    /* Better input placeholder */
    input::placeholder { color: rgba(154, 135, 101, 0.6); font-style: italic; }
  </style>
  <link rel="stylesheet" href="tailwind.css">
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
