        <stop offset="0%" stop-color="#2a1f14"/>
        <stop offset="60%" stop-color="#15100a"/>
        <stop offset="100%" stop-color="#05030a"/>
      </radialGradient>
      <radialGradient id="glow" cx="50%" cy="45%" r="55%">
